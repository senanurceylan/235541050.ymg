<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 1070" width="760" height="1070" font-family="Arial, Helvetica, sans-serif" font-size="12">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
    <style>
      .d{fill:#e8f5ec;stroke:#1b7a3d;stroke-width:1.6}
      .v{fill:#fff4e5;stroke:#b26a00;stroke-width:1.4;stroke-dasharray:6 4}
      .o{fill:#f2f2f2;stroke:#555;stroke-width:1.4;stroke-dasharray:2 3}
      .al{fill:#fdecee;stroke:#b00020;stroke-width:1.6}
      .t{text-anchor:middle;fill:#111}
      .s{text-anchor:middle;font-size:10.5px;fill:#444}
      .l{stroke:#333;stroke-width:1.3;fill:none;marker-end:url(#a)}
      .la{stroke:#b00020;stroke-width:1.3;fill:none;marker-end:url(#a);stroke-dasharray:4 3}
      .lb{font-size:10.5px;fill:#333}
    </style>
  </defs>
  <rect width="760" height="1070" fill="#fff"/>

  <!-- 1 -->
  <rect class="v" x="120" y="20" width="320" height="44" rx="22"/>
  <text class="t" x="280" y="38">1. Operatör reçete/format seçer ve başlatır</text>
  <text class="s" x="280" y="55">[V] — farklı şişe hacmi desteği [D4]</text>
  <path class="l" d="M280,64 V90"/>

  <!-- 2 -->
  <rect class="v" x="120" y="90" width="320" height="44"/>
  <text class="t" x="280" y="108">2. Ürün, dolum tankında/hattında hazır</text>
  <text class="s" x="280" y="125">[V] (tank ve besleme yapısı [B])</text>
  <path class="l" d="M280,134 V160"/>

  <!-- 3 -->
  <rect class="v" x="120" y="160" width="320" height="44"/>
  <text class="t" x="280" y="178">3. Şişe, konveyörle dolum istasyonuna gelir</text>
  <text class="s" x="280" y="195">[V] (konveyör tipi [B])</text>
  <path class="l" d="M280,204 V225"/>

  <!-- D1 -->
  <polygon class="v" points="280,225 400,265 280,305 160,265"/>
  <text class="t" x="280" y="263">Şişe algılandı mı?</text>
  <text class="s" x="280" y="279">[V]</text>
  <path class="l" d="M280,305 V330"/>
  <text class="lb" x="290" y="322">Evet</text>
  <path class="la" d="M400,265 H615 V380"/>
  <text class="lb" x="425" y="257">Hayır (zaman aşımı)</text>

  <!-- 4 -->
  <rect class="v" x="120" y="330" width="320" height="44"/>
  <text class="t" x="280" y="348">4. Dolum valfi açılır</text>
  <text class="s" x="280" y="365">[V] (valf tipi ve sürüşü [B])</text>
  <path class="l" d="M280,374 V400"/>

  <!-- 5 -->
  <rect class="d" x="120" y="400" width="320" height="44"/>
  <text class="t" x="280" y="418">5. Elektromanyetik flowmetre akışı ölçer</text>
  <text class="s" x="280" y="435">[D3] (sinyal tipi ve marka [B])</text>
  <path class="l" d="M280,444 V470"/>

  <!-- D2 -->
  <polygon class="v" points="280,470 400,510 280,550 160,510"/>
  <text class="t" x="280" y="507">Hedef hacme</text>
  <text class="t" x="280" y="522">ulaşıldı mı? [V]</text>
  <path class="l" d="M160,510 H100 V422 H120"/>
  <text class="lb" x="104" y="535">Hayır (dolum sürer)</text>
  <path class="la" d="M400,510 H615 V460"/>
  <text class="lb" x="420" y="528">Akış yok / zaman aşımı</text>
  <path class="l" d="M280,550 V580"/>
  <text class="lb" x="290" y="572">Evet</text>

  <!-- Alarm -->
  <rect class="al" x="500" y="380" width="230" height="80" rx="6"/>
  <text class="t" x="615" y="400" font-weight="bold">ALARM / BEKLETME</text>
  <text class="s" x="615" y="417">HMI'da hata mesajı [V]</text>
  <text class="s" x="615" y="433">Operatör müdahalesi ve reset [V]</text>
  <text class="s" x="615" y="449">→ ardından 3. adıma dönülür</text>

  <!-- 6 -->
  <rect class="v" x="120" y="580" width="320" height="44"/>
  <text class="t" x="280" y="598">6. Dolum valfi kapanır</text>
  <text class="s" x="280" y="615">[V]</text>
  <path class="l" d="M280,624 V650"/>

  <!-- D3 optional -->
  <polygon class="o" points="280,650 400,690 280,730 160,690"/>
  <text class="t" x="280" y="687">Kapak modülü</text>
  <text class="t" x="280" y="702">var mı? (opsiyonel)</text>
  <path class="l" d="M400,690 H500"/>
  <text class="lb" x="438" y="682">Evet</text>
  <rect class="o" x="500" y="668" width="230" height="44"/>
  <text class="t" x="615" y="686">7. Kapak kapatma istasyonu</text>
  <text class="s" x="615" y="703">Opsiyonel [D5], kesin bileşen değil</text>
  <path class="l" d="M615,712 V782 H440"/>
  <path class="l" d="M280,730 V760"/>
  <text class="lb" x="290" y="750">Hayır</text>

  <!-- 8 -->
  <rect class="v" x="120" y="760" width="320" height="44"/>
  <text class="t" x="280" y="778">8. Şişe, çıkış konveyörüne aktarılır</text>
  <text class="s" x="280" y="795">[V]</text>
  <path class="l" d="M280,804 V830"/>

  <!-- 9 -->
  <rect class="v" x="120" y="830" width="320" height="44"/>
  <text class="t" x="280" y="848">9. Sayaç ve üretim verisi güncellenir</text>
  <text class="s" x="280" y="865">[V] (HMI'da gösterim varsayımsal)</text>
  <path class="l" d="M280,874 V900"/>

  <!-- D4 -->
  <polygon class="v" points="280,900 400,940 280,980 160,940"/>
  <text class="t" x="280" y="937">Üretim</text>
  <text class="t" x="280" y="952">devam mı? [V]</text>
  <path class="l" d="M160,940 H55 V182 H120"/>
  <text class="lb" transform="rotate(-90 45 600)" x="45" y="600" text-anchor="middle">Evet: sonraki şişe</text>
  <path class="l" d="M400,940 H500"/>
  <text class="lb" x="436" y="932">Hayır</text>
  <rect class="v" x="500" y="918" width="170" height="44" rx="22"/>
  <text class="t" x="585" y="936">BİTİR / Durdur</text>
  <text class="s" x="585" y="953">[V]</text>

  <!-- Legend -->
  <line x1="20" y1="1005" x2="740" y2="1005" stroke="#ccc"/>
  <rect class="d" x="20" y="1020" width="26" height="16"/>
  <text x="54" y="1033">Doğrulanmış [D]</text>
  <rect class="v" x="180" y="1020" width="26" height="16"/>
  <text x="214" y="1033">Varsayımsal [V]</text>
  <rect class="o" x="340" y="1020" width="26" height="16"/>
  <text x="374" y="1033">Opsiyonel özellik</text>
  <rect class="al" x="510" y="1020" width="26" height="16"/>
  <text x="544" y="1033">Alarm / hata yolu</text>
  <text x="20" y="1058" font-size="10" fill="#555">[Dn]: Aşama 1, Tablo 1.3'teki doğrulanmış özellik numarası. [B]: kamuya açık kaynakta bilgi yok.</text>
</svg>

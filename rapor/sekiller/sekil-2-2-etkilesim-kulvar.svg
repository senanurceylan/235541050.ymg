<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 630" width="1050" height="630" font-family="Arial, Helvetica, sans-serif" font-size="12">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
    <style>
      .d{fill:#e8f5ec;stroke:#1b7a3d;stroke-width:1.6}
      .v{fill:#fff4e5;stroke:#b26a00;stroke-width:1.4;stroke-dasharray:6 4}
      .o{fill:#f2f2f2;stroke:#555;stroke-width:1.4;stroke-dasharray:2 3}
      .lane{fill:#fafafa;stroke:#bbb}
      .lab{fill:#eef1f5;stroke:#999}
      .t{text-anchor:middle;fill:#111}
      .s{text-anchor:middle;font-size:10.5px;fill:#444}
      .h{text-anchor:middle;font-weight:bold;fill:#222}
      .l{stroke:#333;stroke-width:1.3;fill:none;marker-end:url(#a)}
      .lg{stroke:#999;stroke-width:1.2;fill:none;marker-end:url(#a);stroke-dasharray:3 3}
      .lb{font-size:10px;fill:#333}
    </style>
  </defs>
  <rect width="1050" height="630" fill="#fff"/>

  <!-- phase headers -->
  <text class="h" x="250" y="26">A. Ayar / bakım</text>
  <text class="h" x="480" y="26">B. Başlatma</text>
  <text class="h" x="710" y="26">C. Dolum çevrimi</text>
  <text class="h" x="940" y="26">D. İzleme ve alarm</text>

  <!-- lanes -->
  <rect class="lane" x="0" y="40" width="1050" height="100"/>
  <rect class="lane" x="0" y="140" width="1050" height="100"/>
  <rect class="lane" x="0" y="240" width="1050" height="100"/>
  <rect class="lane" x="0" y="340" width="1050" height="100"/>
  <rect class="lane" x="0" y="440" width="1050" height="110"/>
  <rect class="lab" x="0" y="40" width="140" height="100"/>
  <rect class="lab" x="0" y="140" width="140" height="100"/>
  <rect class="lab" x="0" y="240" width="140" height="100"/>
  <rect class="lab" x="0" y="340" width="140" height="100"/>
  <rect class="lab" x="0" y="440" width="140" height="110"/>
  <text class="h" x="70" y="88">Operatör</text>
  <text class="s" x="70" y="104">(rol [V])</text>
  <text class="h" x="70" y="188">Bakım personeli</text>
  <text class="s" x="70" y="204">(rol [V])</text>
  <text class="h" x="70" y="282">HMI</text>
  <text class="s" x="70" y="298">dokunmatik ekran [D2]</text>
  <text class="s" x="70" y="313">marka/model [B]</text>
  <text class="h" x="70" y="382">PLC</text>
  <text class="s" x="70" y="398">kontrol [D1]</text>
  <text class="s" x="70" y="413">marka/model [B]</text>
  <text class="h" x="70" y="482">Saha cihazları</text>
  <text class="s" x="70" y="498">flowmetre [D3]</text>
  <text class="s" x="70" y="513">diğerleri [V]</text>

  <!-- A -->
  <rect class="v" x="155" y="160" width="190" height="60" rx="6"/>
  <text class="t" x="250" y="183">Flowmetre kalibrasyonu,</text>
  <text class="t" x="250" y="198">dolum ayarları</text>
  <text class="s" x="250" y="213">[V] — yetki seviyesi [B]</text>
  <rect class="v" x="155" y="260" width="190" height="60" rx="6"/>
  <text class="t" x="250" y="286">Ayar / reçete ekranları</text>
  <text class="s" x="250" y="303">[V]</text>
  <rect class="v" x="155" y="360" width="190" height="60" rx="6"/>
  <text class="t" x="250" y="383">Parametreleri belleğe yazar</text>
  <text class="s" x="250" y="399">(hedef hacim, katsayı, hız)</text>
  <text class="s" x="250" y="413">[V]</text>
  <path class="l" d="M250,220 V260"/>
  <path class="l" d="M250,320 V360"/>

  <!-- B -->
  <rect class="v" x="385" y="60" width="190" height="60" rx="6"/>
  <text class="t" x="480" y="85">Reçete seçer,</text>
  <text class="t" x="480" y="100">Başlat'a basar</text>
  <text class="s" x="480" y="114">[V]</text>
  <rect class="v" x="385" y="260" width="190" height="60" rx="6"/>
  <text class="t" x="480" y="283">Dokunmatik ekrandan</text>
  <text class="t" x="480" y="298">start komutu</text>
  <text class="s" x="480" y="313">ekran [D2] / komut akışı [V]</text>
  <rect class="v" x="385" y="360" width="190" height="60" rx="6"/>
  <text class="t" x="480" y="385">Çevrimi başlatır,</text>
  <text class="t" x="480" y="400">konveyörü sürer</text>
  <text class="s" x="480" y="414">[V]</text>
  <rect class="v" x="385" y="460" width="190" height="60" rx="6"/>
  <text class="t" x="480" y="485">Konveyör motoru,</text>
  <text class="t" x="480" y="500">şişe varlık sensörü</text>
  <text class="s" x="480" y="514">[V]</text>
  <path class="l" d="M480,120 V260"/>
  <path class="l" d="M480,320 V360"/>
  <path class="l" d="M468,420 V460"/>
  <path class="l" d="M492,460 V420"/>
  <text class="lb" x="463" y="445" text-anchor="end">komut</text>
  <text class="lb" x="497" y="445">şişe var</text>

  <!-- C -->
  <rect class="v" x="615" y="360" width="190" height="60" rx="6"/>
  <text class="t" x="710" y="383">Valf aç → hacmi topla</text>
  <text class="t" x="710" y="398">→ hedefte valf kapat</text>
  <text class="s" x="710" y="413">[V]</text>
  <rect class="v" x="615" y="460" width="90" height="60" rx="6"/>
  <text class="t" x="660" y="485">Dolum valfi</text>
  <text class="s" x="660" y="502">[V]</text>
  <rect class="d" x="715" y="460" width="90" height="60" rx="6"/>
  <text class="t" x="760" y="485">EM flowmetre</text>
  <text class="s" x="760" y="502">[D3]</text>
  <path class="l" d="M660,420 V460"/>
  <path class="l" d="M760,460 V420"/>
  <text class="lb" x="655" y="445" text-anchor="end">aç/kapat</text>
  <text class="lb" x="765" y="445">akış sinyali</text>
  <text class="s" x="710" y="540">(+ kapak modülü: yalnızca opsiyonel [D5])</text>

  <!-- D -->
  <rect class="v" x="845" y="360" width="190" height="60" rx="6"/>
  <text class="t" x="940" y="385">Sayaç, durum ve</text>
  <text class="t" x="940" y="400">alarm üretir</text>
  <text class="s" x="940" y="414">[V]</text>
  <rect class="v" x="845" y="260" width="190" height="60" rx="6"/>
  <text class="t" x="940" y="286">Durum / alarm ekranı</text>
  <text class="s" x="940" y="303">[V]</text>
  <rect class="v" x="845" y="60" width="190" height="60" rx="6"/>
  <text class="t" x="940" y="85">İzler, alarmı onaylar,</text>
  <text class="t" x="940" y="100">reset verir</text>
  <text class="s" x="940" y="114">[V]</text>
  <path class="l" d="M940,360 V320"/>
  <path class="l" d="M940,260 V120"/>

  <!-- time flow on PLC lane -->
  <path class="lg" d="M345,390 H385"/>
  <path class="lg" d="M575,390 H615"/>
  <path class="lg" d="M805,390 H845"/>

  <!-- legend -->
  <rect class="d" x="20" y="575" width="26" height="16"/>
  <text x="54" y="588">Doğrulanmış [D]</text>
  <rect class="v" x="190" y="575" width="26" height="16"/>
  <text x="224" y="588">Varsayımsal [V]</text>
  <line class="lg" x1="370" y1="583" x2="410" y2="583"/>
  <text x="418" y="588">PLC çevriminin zaman akışı</text>
  <text x="20" y="615" font-size="10" fill="#555">Not: HMI–PLC ve PLC–saha bağlantılarının fiziksel/protokol türü kamuya açık kaynaklarda yoktur [B]; oklar yalnızca mantıksal veri akışını gösterir.</text>
</svg>
